name: Unpack & Deploy DAWAYA App Page
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Unpack ZIP
        run: |
          for z in dawaya-app-download-site.zip *.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z" -d . -x ".github/*"
              rm -f "$z"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "chore: unpack app download page" || true
              git push origin HEAD:main || true
            fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
